apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default

  source:
    # This is the difference with p3: the repository is the local GitLab,
    # reached by its service name inside the cluster (not GitHub anymore).
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/playground.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
