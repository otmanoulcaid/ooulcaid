apiVersion: v1
kind: Service
metadata:
  name: ooulcaid-playground
  namespace: dev
  labels:
    app: ooulcaid-playground
spec:
  # NodePort 30888 is published on the host as localhost:8888 by the k3d
  # load balancer (see create_cluster.sh: -p "8888:30888@loadbalancer").
  type: NodePort
  selector:
    app: ooulcaid-playground
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
      nodePort: 30888
