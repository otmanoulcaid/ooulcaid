apiVersion: apps/v1
kind: Deployment
metadata:
  name: ooulcaid-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ooulcaid-playground
  template:
    metadata:
      labels:
        app: ooulcaid-playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888