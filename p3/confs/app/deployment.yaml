apiVersion: apps/v1
kind: Deployment
metadata:
  name: ooulcaid-playground
  namespace: dev
  labels:
    app: ooulcaid-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ooulcaid-playground
  template:
    metadata:
      labels:
        app: ooulcaid-playground
    spec:
      containers:
        - name: playground
          # Version tracked by GitOps: bump this tag (v1 <-> v2), push,
          # and Argo CD rolls the new version out on its own.
          image: wil42/playground:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
